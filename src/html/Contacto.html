    <main class="row px-3 pb-3">
        <section class="col-12 col-md-6 col-lg-6">
            <h1 class="mt-3 mb-3">Contacto</h1>
            <form class="formulario_contacto">
                <div class="row gap-3">
                    <div class="mb-3 col-md-12 col-lg-5">
                        <label for="nombres" class="form-label">Nombres</label>
                        <input type="text" class="form-control" name="nombres" required id="nombres" placeholder="Mariela">
                    </div>
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="apellidos" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" name="apellidos" required id="apellidos" placeholder="Benito">
                    </div>
                </div>
                <div class="row gap-3">
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" name="correo" required id="correo" placeholder="nombre@ejemplo.com">
                    </div>
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            name="telefono"
                            required 
                            pattern="[0-9]{4}-[0-9]{4}" 
                            minlength="9"
                            maxlength="9"
                            id="telefono" 
                            placeholder="0000-0000"
                            title="Ingresa el formato correcto 0000-0000"
                        >
                </div>
                <div class="row gap-3">
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="empresa" class="form-label">Empresa</label>
                        <input type="text" class="form-control" name="empresa" required id="empresa" placeholder="ElectroTech">
                    </div>
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="direccion" required id="direccion" placeholder="123 zona centro">
                    </div>
                </div>
                <div class="row gap-3">
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="tipoContacto" class="form-label">Tipo de contacto</label>
                        <select class="form-select" aria-label="Seleccione una opcion" required name="tipoContacto">
                            <option selected>Seleccione una opción</option>
                            <option value="Personal">Personal</option>
                            <option value="Negocio">Negocio</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Cliente">Cliente</option>
                            <option value="Socios">Socios</option>
                        </select>
                    </div>
                    <div class="mb-3 col-12 col-md-12 col-lg-5">
                        <label for="tipoRol" class="form-label">Tipo de rol</label>
                        <select class="form-select" aria-label="Seleccione un rol" required name="tipoRol">
                            <option selected>Seleccione una opción</option>
                            <option value="Manager">Manager</option>
                            <option value="Ejecutivo">Ejecutivo</option>
                            <option value="Empleado">Empleado</option>
                            <option value="Contractor">Contractor</option>
                            <option value="Consultor">Consultor</option>
                            <option value="Representante de ventas">Representante de ventas</option>
                            <option value="Soporte tectnico">Soporte tectnico</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="preferenciaContacto" class="form-label">Preferencia de contacto</label>
                    <div class="row gap-md-12 gap-lg-3 px-4">
                        <div class="form-check col-12 col-md-3">
                            <input class="form-check-input" type="radio" name="preferenciaContacto" id="preferenciaWhatsApp" value="WhatsApp" required>
                            <label class="form-check-label" for="preferenciaWhatsApp">
                                WhatsApp
                            </label>
                        </div>
                        <div class="form-check col-12 col-md-3 col-lg-3">
                            <input class="form-check-input" type="radio" name="preferenciaContacto" id="preferenciaCorreo" value="Correo" required>
                            <label class="form-check-label" for="preferenciaCorreo">
                                Correo
                            </label>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-12 col-md-12 col-lg-10">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" required id="mensaje" rows="4"></textarea>
                    </div>
                </div>
                <div class="row mb-sm-5">
                    <button type="submit" class="btn btn-secondary col-12 col-md-12 col-lg-2">Contactar</button>
                </div>
            </form>
        </section>
        <section class="col-12 col-md-6 col-lg-6 d-flex align-items-center d-none d-sm-none d-md-block d-lg-block">
            <img src="../../assets/svg/contacto.svg" width="90%" alt="Contacto">
        </section>
